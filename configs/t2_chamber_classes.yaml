  # unknown (Unknown, null base)
  Unknown: surrounding          # T2 E8.5, E10.5; rule 3 default (see exceptions)
  Artificial: surrounding       # rule 3 default (see exceptions)

# Labels whose category differs from group_base[their lineage-map group], or whose group has a null base.
exceptions:
  ST: >-
    Septum transversum: rule 2 places it in surrounding, as configs/t1_chamber_classes.yaml does.
  Early VIC: >-
    Early valve interstitial cells (cushion mesenchyme): rule 2 places them in endocardium, as
    configs/t1_chamber_classes.yaml does (its exception gives the evidence). Not a T2 label.
  LPM: >-
    Lateral plate mesoderm, a null-base group: rule 3's default, surrounding. No evidence places it inside the heart in
    this port, which runs none.
  Unknown: >-
    Unknown, a null-base group: rule 3's default, surrounding.
  Artificial: >-
    An artefact cluster of a T3 file, group Unknown (null base): rule 3's default, surrounding.
