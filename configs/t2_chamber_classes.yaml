  Foregut: surrounding          # T2 E9.5
  D-FG: surrounding             # T2 E8.5, E8.75
  V-FG: surrounding
  a-FG: surrounding             # T2 E8.5, E8.75
  Lateral FG: surrounding       # T2 E8.5, E8.75
  Gut Endoderm: surrounding     # T2 E8.5, E8.75
  Hindgut: surrounding          # T2 E8.5, E8.75
  Epithelium: surrounding
  EXE-Endoderm: surrounding     # T2 E8.5, E8.75
  Bronchus: surrounding         # T2 E10.5
  Ventral Foregut: surrounding
  Dorsal Foregut: surrounding
  Extra Endoderm: surrounding
  Hepatocyte: surrounding
  Hepatocytes: surrounding      # T2 E9.5, E10.5
  # ectoderm (Ectoderm) and neural tissue (Neural)
  Surface Ectoderm: surrounding
  SE: surrounding               # T2 E9.5, E10.5
  aSE: surrounding
  pSE: surrounding              # T2 E8.5, E8.75
  V-SE: surrounding
  d-CSE: surrounding            # T2 E8.5, E8.75
  V-CSE: surrounding            # T2 E8.5, E8.75
  EXE-Ectoderm: surrounding
  Ventral Surface Ectoderm: surrounding
  Dorsal Surface Ectoderm: surrounding
  Neural Tube: surrounding      # T2 E8.5, E8.75
  Forebrain: surrounding        # T2 E8.5, E8.75
  Hindbrain: surrounding
  # blood (Blood)
  Blood: blood
  Blood Progenitor: blood
  Macrophage: blood
  # epiblast and streak (EpiblastStreak)
  Anterior Epiblast: surrounding
  Caudal Epiblast: surrounding  # T2 E8.5, E8.75
