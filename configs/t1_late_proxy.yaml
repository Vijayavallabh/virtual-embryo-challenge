# The within-type reads of the T1 late-proxy tournament (experiments/harness/TRIES.md T13-T18;
# experiments/t1_m1/late_proxy.py; docs/PLAN.md decision log 2026-11-10 (a)). Each is a released-stage backtest whose
# target, reference and inputs are cut to one chamber category (`target_filter.within`, configs/t1_chamber_classes.yaml),
# so that the two E10.5 tasks' draw of E9.5's chamber mix cannot judge a cardiomyocyte-enriched gene class through
# composition. Fixed before any result, under the same check as configs/pseudo_tasks.yaml (vec.harness.load_tasks); the
# three whole-population tasks of configs/pseudo_tasks.yaml are read as they are. The harness hands candidates no file
# paths and refuses, while one builds, any read of data/raw, runs/, experiments/*/results/ or docs/research/.

T1:late_proxy:
  - key: "T1/E8.5->E9.5:cm"
    task: T1
    kind: extrap
    target: T1/E9.5_RNA.h5ad
    reference: T1/E8.5_RNA.h5ad
    inputs: {ref: T1/E8.5_RNA.h5ad}
    validation_board: null
    twin_board: "T1:val"
    target_filter: {within: cm}
    notes: "The tournament's held-out read: T1's cardiomyocytes from E8.5 to E9.5. The cleanest of the three tasks:
      no T1 direction candidate has run on it (the readout's smoke read of Feng's E9.5 -> E14.5 direction before E10.5
      was released used other metrics and this task's whole-population truth), and within type it carries no chamber
      mix. Cut to E8.5's and E9.5's cardiomyocyte labels by configs/t1_chamber_classes.yaml."
  - key: "T1/E9.5->E10.5:cm"
    task: T1
    kind: extrap
    target: T1/E10.5_RNA.h5ad
    reference: T1/E9.5_RNA.h5ad
    inputs: {ref: T1/E9.5_RNA.h5ad, start: T1/E8.5_RNA.h5ad}
    validation_board: null
    twin_board: "T1:val"
    target_filter: {within: cm}
    notes: "Cardiomyocytes from E9.5 to E10.5. A known feature: the E9.5 -> E10.5 transition was read by the
      pre-registered direction readout and M1's diagnostic (diag_v1) with Feng's E9.5 -> E14.5 direction, so a gain here
      alone proves little; see the rule in experiments/harness/TRIES.md T13-T18."
  - key: "T1/E9.5->E10.5:endocardium"
    task: T1
    kind: extrap
    target: T1/E10.5_RNA.h5ad
    reference: T1/E9.5_RNA.h5ad
    inputs: {ref: T1/E9.5_RNA.h5ad, start: T1/E8.5_RNA.h5ad}
    validation_board: null
    twin_board: "T1:val"
    target_filter: {within: endocardium}
    notes: "Endocardium (E10.5's cushion EndoMT and Early VIC cells included by the chamber config) from E9.5 to E10.5.
      The same known feature as the cardiomyocyte read. E8.5's only endocardium-category cells are its mixed
      Endothelium label (a file override), so no E8.5 -> E9.5 endocardium read exists."
