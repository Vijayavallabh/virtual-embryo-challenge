# Coarse lineage groups for every stage-specific cell-type label in the released files.
#
# Built 2026-10-18 from label names checked against marker-gene expression per label (scripts/label_markers.py,
# runs/label_markers.tsv on the DGX). The organisers' cross-stage label table is not published yet; replace or
# refine this when it is. Flags:
#   core:   counts toward the "core cardiac" cloud used for heart size: cardiomyocytes and endocardium, including
#           cushion endocardium. Epicardium, proepicardium and septum transversum are shell (decided 2026-10-19, so
#           the core means the same thing at every stage). Everything else is "shell" (T2 heart scope modelling).
#   mesp1:  whether the group is (mostly) Mesp1-derived, i.e. cell-autonomously affected by Mesp1-Cre knockouts in T3:
#           yes / partial / no. Mesp1 marks early cardiac and cranial mesoderm, extra-embryonic mesoderm and their
#           derivatives; endoderm, ectoderm, neural tube and neural crest are not Mesp1-derived.
#   merged: coarser level for cross-stage and cross-file work, kept only for groups whose label transfer between
#           E8.75 and E9.5 is usable (experiments/harmonise/REPORT.md). null = no stable cross-stage meaning (for
#           example CardiacProgenitor is JCF/SHF at E8.75 but DMP at E9.5); leave those out of cross-stage trends.
#
# Label names do not line up across files: the same name can mean different cells (KO "LPM" is mostly WT pericardium;
# KO "SV-CM" is mostly WT "A-CM"). Compare compositions across files only through vec.harmonise, never by name.
# `file_overrides` remaps a label for one file (keyed by file stem) where the classifier evidence is clear.
#
# Rule for labels first seen in a new file (pre-registered 2026-10-19, before the 2026-10-20 release). Map every new
# label and commit the map before running anything on that file. A label is core only if it names cardiomyocytes
# (CM, myocardium, atrial/ventricular/OFT/AVC/IFT/SV myocytes, trabecular or compact myocardium, conduction cells) or
# endocardium (Endo, endocardial, cushion or valve endocardium, cushion EndoMT cells); epicardium, epicardium-derived
# cells, fibroblasts, smooth muscle, pericytes, blood and vascular endothelium are shell. When a name is ambiguous,
# check its marker genes with scripts/label_markers.py and its classifier calls with vec.harmonise against the nearest
# released stage, record the evidence in the comment, and default to shell.

groups:
  CM:                 {core: true,  mesp1: "yes",     merged: CM}
  CardiacProgenitor:  {core: false, mesp1: "yes",     merged: null}               # FHF/SHF/JCF progenitors, DMP
  Endocardium:        {core: true,  mesp1: "yes",     merged: Endothelial}
  Endothelium:        {core: false, mesp1: "partial", merged: Endothelial}        # vascular and haemato-endothelial
  EpicardiumST:       {core: false, mesp1: "yes",     merged: null}               # proepicardium, septum transversum
  Pericardium:        {core: false, mesp1: "yes",     merged: null}
  PharyngealMesoderm: {core: false, mesp1: "yes",     merged: CranialMesoderm}
  ParaxialMesoderm:   {core: false, mesp1: "partial", merged: CranialMesoderm}    # cranial paraxial partly Mesp1
  LPM:                {core: false, mesp1: "partial", merged: null}
  ExtraEmbryonicMeso: {core: false, mesp1: "partial", merged: ExtraEmbryonicMeso} # ExEM, allantois
  NCC:                {core: false, mesp1: "no",      merged: NCC}
  Endoderm:           {core: false, mesp1: "no",      merged: Endoderm}           # foregut, gut, visceral/EXE endoderm
  Hepatocyte:         {core: false, mesp1: "no",      merged: Endoderm}
  Ectoderm:           {core: false, mesp1: "no",      merged: Ectoderm}           # surface and cranial surface ectoderm
  Neural:             {core: false, mesp1: "no",      merged: Neural}
  Blood:              {core: false, mesp1: "partial", merged: Blood}
  EpiblastStreak:     {core: false, mesp1: "no",      merged: EpiblastStreak}     # epiblast, primitive streak
  Unknown:            {core: false, mesp1: "partial", merged: null}

labels:
  # cardiomyocytes
  OFT/RV-CM: CM
  IFT-CM: CM
  AVC-CM: CM
  RV-CM: CM
  LV-CM: CM
  SV-CM: CM                    # in the Mab21l2 KO file this label is mostly WT "A-CM" (78%)
  V-CM: CM
  A-CM: CM
  OFT-CM: CM
  vCM: CM
  FHF: CM                      # E8.0: CM markers dominate (Myl7, Myh7)
  # progenitors
  pSHF: CardiacProgenitor
  aSHF: CardiacProgenitor
  SHF: CardiacProgenitor
  JCF: CardiacProgenitor
  CP: CardiacProgenitor        # E6.75/E7.25 cardiac progenitors
  DMP: CardiacProgenitor       # dorsal mesenchymal protrusion (SHF-derived)
  DPM: CardiacProgenitor       # Mab21l2 KO vocabulary; see file_overrides
  # endocardium / endothelium
  Endocardium: Endocardium
  Endo: Endocardium
  Chamber-Endo: Endocardium
  Cush-EndoMT-Endo: Endocardium
  Endothelium: Endothelium
  BEC: Endothelium
  early-VEC: Endothelium
  Great Artery Endoth: Endothelium
  Intra-Endoth: Endothelium
  Intra-Endoth-1: Endothelium
  Intra-Endoth-2: Endothelium
  HEM-Endoth: Endothelium
  EXE-Endothlium: Endothelium
  Allantois Endothelium: Endothelium
  # epicardium lineage, pericardium
  Proepicardium: EpicardiumST
  Proepi: EpicardiumST
  ST: EpicardiumST
  Pericardium: Pericardium
  Peri: Pericardium
  # mesoderm
  aPHM: PharyngealMesoderm
  pPHM: PharyngealMesoderm
  Lateral-PAM: PharyngealMesoderm   # SHF markers present alongside paraxial ones
  PHM/PAM: ParaxialMesoderm         # E6.75/E7.25 early cranial mesoderm
  PAM-1: ParaxialMesoderm
  PAM-2: ParaxialMesoderm
  PAM-3: ParaxialMesoderm
  PAM-4: ParaxialMesoderm
  Dorsal-PAM: ParaxialMesoderm
  Paraxial Mesoderm: ParaxialMesoderm
  SOM: ParaxialMesoderm
  LPM: LPM
  EXEM: ExtraEmbryonicMeso
  ExEM-1: ExtraEmbryonicMeso
  ExEM-2: ExtraEmbryonicMeso
  p-EXEM: ExtraEmbryonicMeso
  Allantois: ExtraEmbryonicMeso
  # neural crest
  NCC: NCC
  NCC-derived: NCC
  Branchial Arch: NCC          # KO vocabulary; 93% of WT E9.5 NCC calls land here, not on WT "Branch Arch"
  Branch Arch: NCC
  # endoderm
  Foregut: Endoderm
  D-FG: Endoderm
  V-FG: Endoderm
  a-FG: Endoderm
  Lateral FG: Endoderm
  Gut Endoderm: Endoderm
  Hindgut: Endoderm
  Epithelium: Endoderm
  EXE-Endoderm: Endoderm
  Hepatocyte: Hepatocyte
  Hepatocytes: Hepatocyte
  # ectoderm, neural
  Surface Ectoderm: Ectoderm
  SE: Ectoderm
  aSE: Ectoderm
  pSE: Ectoderm
  V-SE: Ectoderm
  d-CSE: Ectoderm
  V-CSE: Ectoderm
  EXE-Ectoderm: Ectoderm
  Neural Tube: Neural
  Forebrain: Neural
  Hindbrain: Neural
  # blood, early embryo, unknown
  Blood: Blood
  Blood Progenitor: Blood
  Anterior Epiblast: EpiblastStreak
  Caudal Epiblast: EpiblastStreak
  Primitive Streak: EpiblastStreak
  Unknown: Unknown

# Per-file remaps, keyed by file stem. Evidence: experiments/harmonise/results/ko_label_concordance.csv (WT E9.5
# classifier calls on the KO cells).
file_overrides:
  E9.5_mab21l2_ko:
    LPM: Pericardium           # 61% WT Peri, 20% ST; early-stage "LPM" (E6.75-E8.75) is real lateral plate mesoderm
    DPM: PharyngealMesoderm    # 80% WT pharyngeal mesoderm (pPHM 54%, aPHM 20%); only 9% matched CardiacProgenitor
