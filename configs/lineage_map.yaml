  Branch Arch: NCC
  # endoderm
  Foregut: Endoderm
  D-FG: Endoderm
  V-FG: Endoderm
  a-FG: Endoderm
  Lateral FG: Endoderm
  Gut Endoderm: Endoderm
  Hindgut: Endoderm
  Epithelium: Endoderm
