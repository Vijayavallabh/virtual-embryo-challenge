# Outside single-cell knockouts of OTHER genes for the Task 3 factor tables (docs/PLAN.md decision log 2026-11-20 (j):
# the captain's ruling "All three tiers (Recommended)"). Fixed 2026-11-20 before any download, from GEO and ArrayExpress
# metadata the scouts read; no count, paper result or score was read. Each dataset needs its own EXTERNAL_DATA.md row
# BEFORE its table enters a model or a check.
#
# status: cleared            fetch.py and process.py accept it.
#         held_phenocopy     not fetched: DATA_POLICY's genotype clause ("a perturbation that phenocopies them counts as
#                            held out") was not quoted to the captain; it waits for one priced question to him (Wls) or
#                            the stricter reading of the Gata4 validation genotype (Hand2, Mef2c). Flip to cleared only
#                            by a commit that cites his ruling.
#         excluded_design    not fetched: a chimera with no wild-type-chimera second difference (the challenger's change
#                            3: strain cis-eQTLs of ESC-derived cells against host cells would read as knockout effects).
#
# Sample selection (fetch.py plan): every GSM of every series in screen_series is screened by t3x_screen before any
# file is chosen; a held-out hit anywhere refuses the whole dataset. Then each sample's joined text (title, source,
# characteristics, description; lower-cased) is matched: `control` first (a control that also matches a knockout's
# gene regex is that knockout's own control), then the `ko` list in order, first match wins (double knockouts are
# listed first). `all`: every regex must match; `none`: no regex may match; `on`: title or text. Samples matching
# exclude_match (on the joined text, or on the title only when exclude_match_on: title) are never selected; a match
# of design_refuse anywhere refuses the dataset. review_cleared entries name a GSM, or a series accession for a
# series-level field (title, summary, overall_design ...), with the review term and the reason. Stages come from the
# characteristics (one value; a range or two values refuse the sample) and must be in stages_used. `expect` counts are
# compared with the suggestion and noted in the plan table. The selectors are written from the scouts' records; the
# GSM titles were NOT all read by me. Since stage 3 a selector only suggests: a wrong one costs a reader's correction,
# not a wrong fetch (see THE PINNED SAMPLE LIST below).
#
# d (the shrinkage's design factor) is derived in code (t3x_common.design_factor) from design and control_relation.
#
# THE PINNED SAMPLE LIST (stage 3, 2026-11-20; README "The pinned sample list"). The selectors above only SUGGEST arms
# in the plan table; they choose nothing. What fetch.py and process.py use is each cleared dataset's `pinned` block,
# empty until the main session and a second, independent reader have read the plan table and pinned, per sample:
#   - {accession: GSMnnn, arm: ko|control, gene: <knockout gene; a control names the gene it controls>,
#      stage: E8.5, files: [<per-sample file names from the plan table>], metadata_sha256: <from the plan table>}
# and (stage 4), beside it, the dataset's `pinned_series` block: one entry per series of screen_series,
#   - {accession: GSEnnn, series_metadata_sha256: <from the SERIES block at the top of the plan tables>}
# Paste what `fetch.py pin-template` prints (one command per arm, every sample named with --gsm; --series for the
# series); never type a hash by hand. A dataset with an empty block is never fetched or processed. Every edit of this
# file changes its sha256: update t3x_common.DATASETS_SHA256 in the SAME commit (`fetch.py datasets-sha` prints the
# value), or every step refuses. The accessions in t3x_common.NEVER_FETCH (and every series a held or excluded
# dataset screens) stay held whatever this file says; a cleared dataset's screen_series may hold none of them.

version: 1
fixed: "2026-11-20, the AI assistant (engineer of the outside-knockout campaign), before any download"
# The lineage transfer has never run on real 10x cells restricted to the panel (the reviewer's point 10). process.py
# writes each sample's confident and unconfident share to QC.json and refuses a knockout gene's table when any of its
# samples has a confident share (label_conf >= 0.6) under this floor. Fixed 2026-11-20 (stage 2) before any download,
# equal to the per-arm stage floor MIN_CONF_SHARE; no count or score was read.
qc_floors:
  min_confident_share_per_sample: 0.5
datasets:

  # ------------------------------------------------------------------------------------------------- (a) canonical Wnt
  - accession: GSE205117
    status: cleared
    tier: wnt
    study: GSE205117
    kind: "T (Brachyury) F0 CRISPR knockout, whole embryo, 10x Multiome (RNA part only)"
    design: f0_crispr
    control_relation: same_series
    repository: geo
    screen_series: [GSE205117]
    stages_used: [E8.5]
    control_definition: "E8.5_CRISPR_T_WT (GSM6205422), the same CRISPR experiment; the WT time course is not used"
    arms:
      control: {on: title, all: ['^\s*e8\.5_crispr_t_wt\b']}
      ko:
        - {gene: T, on: title, all: ['^\s*e8\.5_crispr_t_ko\b']}
    exclude_match: ['(?<![a-z])atac(?![a-z])']
    exclude_match_on: title
    design_refuse: ['chimer', 'tdtom', '(?<![a-z])host(?![a-z])']
    expect: {E8.5: {ko: 1, control: 1}}
    sample_file_patterns: ['(matrix\.mtx|barcodes\.tsv|features\.tsv|genes\.tsv)(\.gz)?$', 'filtered_feature_bc_matrix\.h5$']
    files_note: "per-sample GEX matrices of the two screened samples only; no fragments, peaks or other samples"
    licence: "GEO: NCBI places no restriction on use; submitter rights may apply (not checked per study)"
    citation: "Argelaguet et al. (per the scout; the series lists no PMID)"
    why: "an in-embryo loss of a direct Wnt target at E8.5 with a same-experiment control"
    risks: "n = 1 library per arm; F0 mosaicism; germline and posterior-centred unlike a Mesp1-lineage cKO; nuclei on both
      arms; whether the arms are chimeras is checked by design_refuse at plan time. Biology only: no released truth
      can check the Wnt tier"
    verified: false
    pinned: []

  - accession: GSE165300
    status: held_phenocopy
    status_reason: "Wls in the Mesp1 lineage is the closest to a phenocopy of the test genotype (Mesp1-Cre; Ctnnb1 F/F);
      the phenocopy clause needs the captain's word first. Its loader (series-level matrix with a MULTI-seq per-cell
      phenotype table, screened by t3x_screen.screen_cells) is not built in stage 1"
    tier: wnt
    study: GSE165300
    kind: "Wls conditional knockout (Mesp1-Cre; Ai9; Wls fl/fl), sorted Mesp1-lineage cells, MULTI-seq pooled"
    design: conditional
    control_relation: same_capture
    repository: geo
    screen_series: [GSE165300]
    stages_used: [E8.0, E8.5, E9.5]
    control_definition: "Wls fl/+ (Mesp1-Cre; Ai9; Wls fl/+) cells in the same captures"
    cell_labels: {genotype_columns: [genotype], hash_columns: [hashing]}
    licence: "GEO: NCBI places no restriction on use; submitter rights may apply"
    verified: false

  # ---------------------------------------------------------------------------------------------- (b) cardiac TFs
  - accession: GSE168768
    status: cleared
    status_reason: "cleared by the engineer's reading that a Tbx1 loss (pharyngeal and outflow-tract phenotype) is not a
      phenocopy of Gata4 loss. The scout synthesis lists Tbx1 among Gata4's cardiac partners, so this reading goes into
      the same priced phenocopy question as Wls, Hand2 and Mef2c."
    tier: cardiac
    study: GSE167493
    kind: "Tbx1 conditional (Tbx1Cre/flox; Rosa26-GFPflox/+), GFP lineage, 10x 3'"
    design: conditional
    control_relation: heterozygous
    repository: geo
    screen_series: [GSE168768, GSE167493]
    stages_used: [E8.5, E9.5]
    control_definition: "Tbx1Cre/+; Rosa26-GFPflox/+ at the same stage (Cre-only, Tbx1 heterozygous)"
    arms:
      control: {on: text, all: ['tbx1\s*-?\s*cre\s*/\s*\+']}
      ko:
        - {gene: Tbx1, on: text, all: ['tbx1\s*-?\s*cre\s*/\s*fl']}
    expect: {E8.5: {ko: 1, control: 1}, E9.5: {ko: 1, control: 1}}
    sample_file_patterns: ['(matrix\.mtx|barcodes\.tsv|features\.tsv|genes\.tsv)(\.gz)?$']
    files_note: "per-sample mtx, 4 samples; E9.5 files use genes.tsv, E8.5 features.tsv"
    licence: "GEO: NCBI places no restriction on use; submitter rights may apply"
    citation: "Nomaru et al., Nat Commun 2021, doi:10.1038/s41467-021-26966-6 (per the scout)"
    why: "cardiopharyngeal TF loss at the two stages around E8.75"
    risks: "n = 1 per arm; heterozygous control (d = 0.5); GFP-sorted lineage, so only some groups are present"
    verified: true
    pinned: []

  - accession: GSE186934
    status: cleared
    status_reason: "cleared by the engineer's reading that a Tbx1 loss (pharyngeal and outflow-tract phenotype) is not a
      phenocopy of Gata4 loss. The scout synthesis lists Tbx1 among Gata4's cardiac partners, so this reading goes into
      the same priced phenocopy question as Wls, Hand2 and Mef2c."
    tier: cardiac
    study: GSE167493
