          - '^GSE137337_(?!.*(bisulf|wgbs|rrbs|methyl|scbs|atac))[A-Za-z0-9_.+-]*(matrix\.mtx|barcodes\.tsv|features\.tsv|genes\.tsv)\.gz$'
