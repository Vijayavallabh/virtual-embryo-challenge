  - accession: GSE270969
    status: cleared
    tier: unrelated
    study: GSE270969
    kind: "Cmtr2 constitutive knockout against wild type, whole embryo, single-nucleus RNA, 10x 3' v3.1, one embryo per library"
    design: germline
    control_relation: same_series
    repository: geo
    screen_series: [GSE270969]
    stages_used: [E9.5]
    control_definition: "the four wild-type E9.5 embryos of the same series (the record states five litters and no littermate relation, and the file-name codes of knockout and wild-type libraries do not overlap, so d = 0.5)"
    arms:
      control: {on: text, all: ['(?<![a-z])(wt|wild[ -]?type)(?![a-z])'], none: ['(?<![a-z])(ko|null|knock-?out)(?![a-z])']}
      ko:
        - {gene: Cmtr2, on: text, all: ['(?<![a-z])(ko|null|knock-?out)(?![a-z])']}
    expect: {E9.5: {ko: 5, control: 4}}
    sample_file_patterns: ['raw_feature_bc_matrix\.tar\.gz$', '(matrix\.mtx|barcodes\.tsv|features\.tsv|genes\.tsv)(\.gz)?$']
    files_note: "one per-sample archive of the unfiltered matrix each (per the searchers; not checked against a plan table)"
    licence: "GEO: NCBI places no restriction on use; submitter rights may apply (not checked per study)"
    citation: "none read (no paper was opened)"
    why: "a whole-embryo E9.5 knockout of an RNA cap methyltransferase with several embryos per arm and a same-series control"
    risks: "nuclei, not cells; unfiltered matrices, so the cell floor does the cell calling and the library cap may refuse; stage and genotype fields not yet read"
    verified: false
    # Stage 7 (2026-11-21, campaign/t3-ext-3; README "Unfiltered per-sample matrices"). Its only per-sample files are the
    # vendor pipeline's unfiltered output, one raw_feature_bc_matrix archive per sample (per the searchers; the exact
    # names were not seen by the engineer). This declaration lifts the unfiltered-matrix deny term for a sample's OWN
    # file that the pattern names, and for nothing else; process reads such a file through the one fixed cell call of
    # t3x_common (RAW_CALL_*). Nothing is pinned: the two readers read the plan table first and confirm from the record
    # that each raw file is one library of one sample. A name the pattern misses is listed as never fetched.
    raw_matrices:
      patterns: ['^GSM\d+_[A-Za-z0-9_.+-]*raw_feature_bc_matrix\.tar\.gz$']
      reason: "the series' only per-sample files are unfiltered matrices (raw_feature_bc_matrix), one archive per single-embryo library; the fixed cell call of t3x_common turns each into called cells"
    # Pinned on 2026-11-20 by two readers (decision log 2026-11-20 (bbb)) and WITHDRAWN the same day (decision log
    # (ddd)) before any table was written: the pipeline's fixed cell call, run on the nine fetched files, kept 3,590 to
    # 4,903 nuclei in each knockout library and 409 to 3,370 in each wild-type library (one under the floor of 500, so
    # refused), at a call level about three times lower in the wild-type libraries, whose called nuclei hold 15% to 47%
    # of their library's UMIs against 63% to 77% in the knockouts. With the library codes that differ between the arms,
    # the two arms were not captured or sequenced alike; a ratio of them would measure that. Nothing is pinned, and no
    # guard was changed.
    pinned: []

