    stages_used: [E9.5]
    control_definition: "Mesp1Cre at E9.5 (per the scout); enters only if plan finds exactly one sample per arm"
    arms:
      control: {on: text, all: ['mesp1\s*-?\s*cre'], none: ['tbx1\s*-?\s*f']}
      ko:
        - {gene: Tbx1, on: text, all: ['mesp1\s*-?\s*cre', 'tbx1\s*-?\s*f']}
    expect: {E9.5: {ko: 1, control: 1}}
    sample_file_patterns: ['(matrix\.mtx|barcodes\.tsv|features\.tsv|genes\.tsv)(\.gz)?$']
    files_note: "per-sample mtx (per the scout)"
    licence: "GEO: NCBI places no restriction on use; submitter rights may apply"
    citation: "Nomaru et al. (per the scout), Nat Commun 2021 (superseries GSE167493)"
    why: "the same Cre as the test and the Gata4 validation"
    risks: "not verified; probably n = 1 per arm; one study unit with GSE168768 (Tbx1 counted once)"
    verified: false
    pinned: []

  - accession: GSE126128
    status: held_phenocopy
    status_reason: "Hand2-null shares RV and SHF phenotype features with the Gata4 validation genotype, whose outside data
      stays barred; held until a ruling. Its loader (series CSV with a gem.group -> sample map) is not built in stage 1"
    tier: cardiac
