    kind: "Hand2-null (germline), microdissected cardiogenic region"
    design: germline
    control_relation: littermate
    repository: geo
    screen_series: [GSE126128]
    stages_used: [E8.25, E9.25]
    control_definition: "WT littermates at the same stage in the same CSV"
    licence: "GEO: NCBI places no restriction on use; submitter rights may apply"
    verified: false

  - accession: GSE280543
    status: held_phenocopy
    status_reason: "Mef2c loss: possible Gata4-phenocopy reading (SHF, RV); held until a ruling"
    tier: cardiac
    study: GSE280587
    kind: "Mef2c knockout (germline), whole embryo, 10x Multiome (RNA part)"
    design: germline
    control_relation: same_series
    repository: geo
    screen_series: [GSE280543, GSE280587]
    stages_used: [E8.5, E9.0]
    control_definition: "WT, 2 replicates per stage, same series and protocol"
    arms:
      control: {on: text, all: ['(?<![a-z])(wt|wild[ -]?type)(?![a-z])'], none: ['mef2c\s*-?\s*(ko|null|knock)']}
      ko:
        - {gene: Mef2c, on: text, all: ['mef2c\s*-?\s*(ko|null|knock)']}
    exclude_match: ['(?<![a-z])atac(?![a-z])']
    exclude_match_on: title
    sample_file_patterns: ['(matrix\.mtx|barcodes\.tsv|features\.tsv|genes\.tsv)(\.gz)?$', 'filtered_feature_bc_matrix\.h5$']
    licence: "GEO: NCBI places no restriction on use; submitter rights may apply"
    verified: false

  # ------------------------------------------------------------------------------------------------- (c) unrelated
  - accession: GSE137337
    status: cleared
    tier: unrelated
    study: GSE137337
    kind: "zygotic F0 CRISPR knockouts of epigenetic regulators, whole embryo, 10x 3' v2/v3"
    design: f0_crispr
    control_relation: same_series
    repository: geo
    screen_series: [GSE137337]
    stages_used: [E8.5]
    control_definition: "WT E8.5 samples of the same series with the same 10x chemistry (v2 or v3, read from the GSM
      text); a knockout with no same-chemistry WT E8.5 is refused; a WT sample whose title names a knockout's gene is
      that knockout's own control"
    arms:
      control: {on: title, all: ['(?<![a-z])(wt|wild[ -]?type|control)(?![a-z])']}
      ko:
        - {gene: Dnmt3a+Dnmt3b, on: title, all: ['dnmt3a[\s_+/-]*(dnmt)?3b|dnmt3ab']}
        - {gene: Eed+Cdkn2a, on: title, all: ['eed[\s_+/-]*cdkn2a|cdkn2a[\s_+/-]*eed']}
        - {gene: Eed, on: title, all: ['(?<![a-z])eed(?![a-z])']}
        - {gene: Rnf2, on: title, all: ['rnf2']}
        - {gene: Kdm2b, on: title, all: ['kdm2b']}
        - {gene: L3mbtl2, on: title, all: ['l3mbtl2']}
        - {gene: Dnmt1, on: title, all: ['dnmt1(?![0-9])']}
        - {gene: Dnmt3a, on: title, all: ['dnmt3a']}
        - {gene: Dnmt3b, on: title, all: ['dnmt3b']}
        - {gene: Ehmt2, on: title, all: ['ehmt2|(?<![a-z])g9a']}
        - {gene: Kmt2a, on: title, all: ['kmt2a']}
        - {gene: Kmt2b, on: title, all: ['kmt2b']}
        - {gene: Cdkn2a, on: title, all: ['cdkn2a']}
