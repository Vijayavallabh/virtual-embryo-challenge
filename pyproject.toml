[project]
name = "vec"
version = "0.1.0"
description = "Virtual Embryo Challenge (NeurIPS 2026), Human Team: models, local board emulator and submission tooling"
readme = "README.md"
authors = [
    { name = "Vijayavallabh", email = "be23b041@smail.iitm.ac.in" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "anndata>=0.11",
    "h5py>=3.11",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pot>=0.9.5",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scanpy>=1.10",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
    # Official local scorer, pinned to a commit so local scores are reproducible.
    "veckit @ git+https://github.com/aristoteleo/veckit@cc3859ab2a2305efc4544815d3f44f660efa77d4",
]

[project.scripts]
vec = "vec.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
# GPU stack, synced only on the DGX: `uv sync --group gpu`
gpu = [
    "torch>=2.5",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
