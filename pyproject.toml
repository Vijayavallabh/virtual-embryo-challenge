[project]
name = "vec"
version = "0.1.0"
description = "Virtual Embryo Challenge (NeurIPS 2026), Human Team: models, local board emulator and submission tooling"
readme = "README.md"
authors = [
    { name = "Vijayavallabh", email = "be23b041@smail.iitm.ac.in" }
]
requires-python = "==3.12.*"
dependencies = [
    "anndata>=0.12",
    "h5py>=3.11",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2,<3",
    "pot>=0.9.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scanpy>=1.11",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
    # Official local scorer, pinned (see [tool.uv.sources]) to the commit the live board matches.
    "veckit",
]

[project.scripts]
vec = "vec.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
# R data reader for the clean Feng reduction from GEO (experiments/external/feng2022_geo.py), DGX only:
# `uv run --group external ...`
external = [
    "rdata>=1.1",
]
# GPU stack, synced only on the DGX: `uv sync --group gpu [--group jax]`
gpu = [
    "geomloss>=0.3.1",
    "scvi-tools>=1.5",
    "torch==2.14.*",
    "torchcfm>=1.0.7",
    "torchdiffeq>=0.2.5",
]
jax = [
    "jax[cuda13]>=0.11",
    "moscot>=0.5.2",
    "ott-jax>=0.6",
]

[tool.uv]
default-groups = ["dev"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torchcfm's core API (ConditionalFlowMatcher, OT plan samplers) never imports torchdyn, which drags in
# torchvision, torchcde<0.3, pytorch-lightning and poethepoet<0.11.
exclude-dependencies = ["torchdyn"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
# PyPI veckit 0.1.2 is not the live scorer (it ranks severity_ratio/size_fidelity and lacks the issue-7 frame fix).
veckit = { git = "https://github.com/aristoteleo/veckit", rev = "cc3859ab2a2305efc4544815d3f44f660efa77d4" }
# ott-jax 0.6.0 on PyPI breaks online PointCloud on jax>=0.9 (ott issue 700); fixed on main.
ott-jax = { git = "https://github.com/ott-jax/ott", rev = "36338c94707002772f2392ffa0a3acf11ab23857" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
